[pytest]
# Kun repoets egne tests. Uden dette samler "pytest" uden argumenter ogsaa
# scripts i data/df-data og kopien data/df-data-2026niveau, hvor
# roundtrip_test.py findes to gange ("import file mismatch").
testpaths = tests
norecursedirs = data output deltagere .git .venv venv
filterwarnings =
    ignore::linopy.semantics.LinopySemanticsWarning
