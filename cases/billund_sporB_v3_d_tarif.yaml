# ==============================================================================
# BILLUND VARMEVÆRK — Spor B (deskriptiv, driven), marts–juni 2026
# ==============================================================================
# v3. Afløser billund_sporB_v2.yaml. Ændringer i v3 (trin 1, session 24):
#
#   1. GASMOTOR SPLITTET I TO ENHEDER. John (26/8 2026): to motorer à 1,7 MW
#      varme / 1,1 MW el UDEN dellast. v2 havde én aggregeret enhed på 2,8 MW
#      med p_min_heat 0,9 — altså en dellastfrihed anlægget ikke har.
#      p_min_heat = p_max_heat = 1,7 og uc_enabled: true pr. motor.
#      [BEKRÆFT] alpha ændret 0,72 → 0,647 (= 1,1/1,7 fra Johns effektangivelse).
#      Rul tilbage til 0,72 hvis 1,1 MW el er nominel og ikke ved fuld last.
#
#   2. VP'S BUD FORDELT PR. MARKED. John: VP bydes med 2 MW eloptag i aFRR-CM
#      og 3 MW i mFRR-CM, inden for de 5,52 MW prækvalificeret i alt.
#      Kræver balancing.ancillary_caps.per_unit_market_mw (ny i src/config.py
#      + src/balancing.py). Bemærk: 2 + 3 = 5 < 5,52 — begge lofter håndhæves,
#      og per-markeds-loftet binder derfor før prækvalificeringen.
#
#   3. HEADER OG META BRAGT AJOUR. v2 arvede sin header fra jan–apr-casen:
#      forkert vindue, 14 MW-loft, og to "BEKRÆFT"-punkter der siden er afgjort.
#
# AFGJORTE PUNKTER (var åbne i v2's header):
#   * Elafgift = 4,0 DKK/MWh. Johns tarifoversigt viser, at de tre A-høj-bånd
#     122,4 / 129,8 / 144,5 ligger præcis 4,0 under summerne inkl. elafgift.
#     tariff_consumption_flat: 128,2 er derfor konsistent med electricity_tax:
#     4,0 og må ikke få de 4 lagt oveni.
#   * Tankvolumen = 14.000 m³ (10.000 + 2.000 + 2.000). Bekræftet af John.
#
# STADIG ÅBENT (bevidst IKKE rørt i v3 — hver har sit eget trin):
#   * delta_t_k er flad 40 K. Reelt: VP leverer kun 70/80 °C til den store
#     tank, resten 95 °C i de to små. Punkt (e), tolagstank.
#   * tariff_consumption_flat er ét tal. Profilen (lav/høj/spids) er punkt (d).
#   * reservation_gate er en fast CM-tærskel. Punkt (a)+(b)+(c).
#   * Sommerens lagerbegrænsning på budafgivelsen er umodelleret. Punkt (g).
#
# KØRES MED:
#   python run_case.py cases/billund_sporB_v3.yaml \
#       --data-source github --df-data-cache data/df-data \
#       --with-balancing \
#       --start 2026-03-02 --end 2026-06-23
#
# REGRESSIONSANKER (v2, samme vindue, jf. STATUS session 23 §3):
#   Spor A objektiv 5.161.182 · Spor B objektiv 5.786.165 · differens 624.983
#   Spor B balance vs facit 91 % (aFRR 99, mFRR 84)
#   Bemærk: differensen er under revision. Analysen af slide 8 viser, at gaten
#   binder kapacitet i timer, hvor VP-varmen er dyrere end halm (433 mod 243
#   DKK/MWh i snit over 770 af 854 reservationstimer). Differensen måler
#   dermed i al væsentlighed vores egen gate-fejl, ikke uindløst værdi.
#   Tallet må ikke bruges eksternt før punkt (c) er inde.
# ==============================================================================

meta:
  case_name: "billund_sporB_v3_d_tarif"
  description: >
    Backtest af activation_value-balancering mod realiseret drift jan–april
    2026. elkedel_ny under inkøring (ikke i drift). Total reserve-loft 14 MW =
    Billunds faktiske prækvalificering. Op-bud = spot + 500 DKK/MWh.
    Sammenlignes mod realiseret balance-facit.
  timezone_internal: "UTC"
  timezone_reporting: "Europe/Copenhagen"
  discount_rate_real: 0.035
  tax_year: 2026

# ------------------------------------------------------------------------------
# TIDSHORISONT
# ------------------------------------------------------------------------------
time:
  # Aftalt med John: kør marts–juni 2026 (rent vindue, post-indkøring, VP på balance).
  # Jan–feb udeladt (indkøringsanomali). Slut ved 23/6 — varme-CSV stopper 24/6 06:00.
  start: "2026-03-01T00:00:00Z"
  end:   "2026-06-23T23:00:00Z"
  resolution: "1h"

# ------------------------------------------------------------------------------
# VARMELAST-SYNTESE (parses men ignoreres når --heat-csv er aktivt)
# ------------------------------------------------------------------------------
heat_load_params:
  gaf_mw_per_k: 0.9761
  t_ref: 15.0
  thermal_inertia_hours: 24
  nettab_slope_mw_per_k: 0.6081
  t_net: 12.0
  baseline_profile_mw:
    [5.66, 5.74, 5.87, 6.08, 6.15, 6.52,
     7.13, 7.15, 6.83, 6.32, 6.09, 5.99,
     5.82, 5.70, 5.63, 5.56, 5.65, 5.87,
     6.03, 6.08, 6.04, 6.03, 5.88, 5.60]
  weekly_dip: 0.02
  _source: "Kalibreret mod Billund ab værk — ignoreres ved --heat-csv"

# ------------------------------------------------------------------------------
# PRISER OG AFGIFTER  (BEKRÆFT: kopieret fra H2 2025 — opdatér til Q1 2026)
# ------------------------------------------------------------------------------
prices:
  natural_gas:
    value: 550.0           # 3 kr/Nm3 commodity (ekskl moms) + kedel-afgifter 3,5349 kr/Nm3 (faktura, ekskl moms) ÷ 11,881 kWh/Nm3
    unit: "DKK/MWh_fuel"
  straw:
    value: 204.6           # 1.030 kr/ton inkl moms ÷ 1,25 ÷ 14,5 GJ/ton × 3,6 (ekskl moms)
    unit: "DKK/MWh_fuel"
  flis:
    value: 195.8           # 68,0 kr/GJ inkl moms ÷ 1,25 × 3,6 (ekskl moms) — egen pris, ikke længere lig halm
    unit: "DKK/MWh_fuel"
  waste_heat:
    value: 50.0
    unit: "DKK/MWh_fuel"
  co2_eua:
    value: 0.0
    unit: "DKK/MWh_gas"

# ------------------------------------------------------------------------------
# ELMARKED OG TARIFFER
# ------------------------------------------------------------------------------
electricity:
  spot_area: "DK1"
  tariff_consumption_flat: 128.2   # bevaret som reference; profilen nedenfor vinder

  # Punkt (d). N1 A-høj forbrugskunder + Energinet, gældende 1/4–31/12 2026.
  # Elafgiften står som dokumentation og valideres mod electricity_tax, men
  # lægges til af modellen — den indgår IKKE i den opløste serie.
  # Lavlasttime = 115 + 0 + 7,4 = 122,4 herfra, 126,4 med afgift.
  tariff_consumption:
    unit: kr_per_mwh
    source: "N1 A-høj + Energinet, 2026-04-01 til 2026-12-31 (Johns tarifoversigt)"
    fixed_components:
      energinet: 115.0
      dv: 0.0
      elafgift_net: 4.0
    net_tariff:
      bands:
        lav: 7.4
        hoej: 14.8
        spids: 29.5
      seasons:
        vinter:
          months: [10, 11, 12, 1, 2, 3]
          weekday: {"00-06": lav, "06-21": spids, "21-24": hoej}
          weekend: {"00-06": lav, "06-21": hoej,  "21-24": hoej}
        sommer:
          months: [4, 5, 6, 7, 8, 9]
          weekday: {"00-06": lav, "06-24": hoej}
          weekend: {"00-06": lav, "06-24": lav}
  tariff_production_flat: 4.1
  electricity_tax: 4.0

# ------------------------------------------------------------------------------
# PRODUKTIONSENHEDER
# ------------------------------------------------------------------------------
units:

  vp_luft_vand:
    enabled: true
    type: "heat_pump"
    p_max_heat: 16.0
    p_min_heat: 0.0
    alpha: -0.333
    fuel: "electricity"
    var_om: 13.4
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    cop_curve:
      type: linear
      a: 2.2
      b: 0.08
      cop_min: 1.8
      cop_max: 4.0
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
      # ANLÆGSFAKTUM (John): VP'en gik først på balancemarkedet 1. marts 2026.
      # Februars nul-deltagelse er en onset/idriftsættelse, ikke en prisrespons.
      # Gaten nulstiller VP'ens reservation før denne dato; varmedispatch urørt.
      available_from: "2026-03-01"
    commissioned: 2025

  # ---- Elkedel ny (30 MW) — IKKE i drift jan–apr 2026 (under inkøring) ----
  elkedel_ny:
    enabled: false
    type: "electric_boiler"
    p_max_heat: 30.0
    p_min_heat: 0.0
    alpha: -1.0
    fuel: "electricity"
    var_om: 13.4
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
    commissioned: 2026
    notes: "Under inkøring jan–apr 2026 — ikke i drift. Reserve-loftet (14 MW) er Billunds prækvalificering og er uafhængigt af denne enheds enabled-flag."

  elkedel_gl:
    enabled: true
    type: "electric_boiler"
    p_max_heat: 12.0          # John 26/8: godkendt 15 MW, teknisk droslet til 12 MW
    p_min_heat: 0.0
    alpha: -1.0
    fuel: "electricity"
    var_om: 6.71
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
    commissioned: 2021

  fliskedel:
    enabled: true
    type: "biomass_boiler"
    p_max_heat: 7.0
    p_min_heat: 2.5           # Billund-bekræftet min-last (~36% af 7 MW)
    alpha: 0.0
    fuel: "flis"
    eta_fuel_to_heat: 0.94    # John
    var_om: 30.0              # ANTAGET = halm — bekræft
    start_cost: 5000.0        # ANTAGET — bekræft
    min_uptime: 168           # Billund: skal mindst køre 1 uge (168 timer) ad gangen
    min_downtime: 6
    uc_enabled: true
    initial_status: 1
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}
    commissioned: 2009

  halmkedel:
    enabled: true
    type: "biomass_boiler"
    p_max_heat: 12.0
    p_min_heat: 4.0
    alpha: 0.0
    fuel: "straw"
    eta_fuel_to_heat: 0.96
    var_om: 30.0
    start_cost: 8000.0
    min_uptime: 4
    min_downtime: 6
    uc_enabled: true
    initial_status: 1
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}
    commissioned: 2015

  gasmotor_1:
    enabled: true
    type: "gas_engine_chp"
    # John 26/8 2026: to motorer à 1,7 MW varme / 1,1 MW el, UDEN dellast.
    # p_min = p_max tvinger enten fuld last eller stop; uc_enabled: true er
    # derfor nødvendig, ellers er enheden bundet til at køre i alle timer.
    p_max_heat: 1.7
    p_min_heat: 1.7
    alpha: 0.647            # [BEKRÆFT] 1,1 MW el / 1,7 MW varme. Var 0,72 i v2.
    fuel: "natural_gas"
    eta_fuel_to_heat: 0.49
    var_om: 608.0
    start_cost: 1000.0      # 2.000 i v2 for den aggregerede enhed → 1.000 pr. motor
    min_uptime: 2
    min_downtime: 2
    uc_enabled: true
    initial_status: 0
    co2_emissions_per_mwh_fuel: 0.0
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
      afrr_max_bid_mw: 0.5
      mfrr_max_bid_mw: 1.0
    commissioned: 2000

  gasmotor_2:
    enabled: true
    type: "gas_engine_chp"
    # John 26/8 2026: to motorer à 1,7 MW varme / 1,1 MW el, UDEN dellast.
    # p_min = p_max tvinger enten fuld last eller stop; uc_enabled: true er
    # derfor nødvendig, ellers er enheden bundet til at køre i alle timer.
    p_max_heat: 1.7
    p_min_heat: 1.7
    alpha: 0.647            # [BEKRÆFT] 1,1 MW el / 1,7 MW varme. Var 0,72 i v2.
    fuel: "natural_gas"
    eta_fuel_to_heat: 0.49
    var_om: 608.0
    start_cost: 1000.0      # 2.000 i v2 for den aggregerede enhed → 1.000 pr. motor
    min_uptime: 2
    min_downtime: 2
    uc_enabled: true
    initial_status: 0
    co2_emissions_per_mwh_fuel: 0.0
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
      afrr_max_bid_mw: 0.5
      mfrr_max_bid_mw: 1.0
    commissioned: 2000

  gaskedel_agg:
    enabled: true
    type: "gas_boiler"
    p_max_heat: 16.3
    p_min_heat: 0.0
    alpha: 0.0
    fuel: "natural_gas"
    eta_fuel_to_heat: 0.95
    var_om: 89.0
    start_cost: 500.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    co2_emissions_per_mwh_fuel: 0.0
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}

  overskudsvarme:
    enabled: false
    type: "waste_heat"
    p_max_heat: 4.0
    p_min_heat: 4.0
    alpha: 0.0
    fuel: "waste_heat"
    eta_fuel_to_heat: 1.0
    var_om: 5.0
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}
    commissioned: 2026

# ------------------------------------------------------------------------------
# VARMELAGER  (BEKRÆFT volumen jan–apr 2026: 12.000 vs 22.000 m³ VAK26)
# ------------------------------------------------------------------------------
storage:
  tank_eksisterende:
    enabled: true
    volume_m3: 14000          # John: 10.000 + 2.000 + 2.000 m3 VAK
    delta_t_k: 40.0
    e_max_mwh: null
    e_initial_mwh: 279
    p_max_charge_mw: 60.0
    p_max_discharge_mw: 60.0
    self_discharge_per_hour: 0.0
    cycle_binding: true
    notes: "Volumen bekræftet 14.000 m3. [BEKRÆFT delta_t: VP vinter 80C=40K, elkedler/biomasse 95C=55K, VP sommer 70C=30K — sæt sæson-/kilde-afhængigt]"

# ------------------------------------------------------------------------------
# BALANCEMARKED — ny metode (activation_value) + generiske lofter
# ------------------------------------------------------------------------------
# method:
#   activation_value = kovarians-korrekt av(t), beregnet i datalaget fra
#                      15-min aktiveringspriser mod budkurven spot + markup.
#   legacy           = gammel E[α]×E[p]. Skift via --balancing-method legacy.
#
# bid_strategy (jf. interview John/Jens, Billund):
#   op-bud = spot + up_markup_dkk_mwh. up_markup_max er øvre båndgrænse
#   (tank-styret positionering, Tier 2 — bruges ikke i Tier-1-av endnu).
#   down_markdown udeladt → up-only (som nuværende modelscope).
#
# ancillary_caps:
#   per_unit_mw: VP ≤ 6 MW (aFRR+mFRR samlet), håndhæves ALTID.
#   total_mw:    Σ alle bud ≤ 14 MW = Billunds FAKTISKE prækvalificerede
#                reservekapacitet (fælles loft over begge markeder/alle enheder
#                pr. time). Var tidligere 15 (sat ud fra elkedel_gl alene); de
#                14 er den reelle prækvalificering og bruges i begge cases.
#                Grænsen følger prækvalificering, ikke hvilke enheder der er
#                enabled eller hvilket tidsvindue der køres.
balancing:
  method: activation_value
  bid_strategy:
    up_markup_dkk_mwh: 500
    up_markup_max_dkk_mwh: 2000
  ancillary_caps:
    per_unit_mw:
      vp_luft_vand: 5.52        # John 26/8: prækvalificeret eloptag i alt
    # John 26/8: VP bydes med 2 MW eloptag i aFRR-CM og 3 MW i mFRR-CM.
    # Summen 5 MW ligger under prækvalificeringen på 5,52 — begge lofter
    # håndhæves, så per-markeds-loftet binder først. Fordelingen mellem
    # markederne bestemmer Billund selv og kan ændres uden ny prækvalificering.
    per_unit_market_mw:
      vp_luft_vand: {afrr: 2.0, mfrr: 3.0}
    total_mw: 17.52          # John 26/8: 5,52 (VP) + 12 (elkedel_gl)
  # Spor B — CM-gate rekalibreret på det RENE vindue marts–juni 2026.
  # gate-frekvens × block_mw = facit MW-snit (aFRR 0,743 / mFRR 0,509).
  #   aFRR: tau=75  → frekvens 26,3 % → B=2,82
  #   mFRR: tau=300 → frekvens 11,4 % → B=4,46
  reservation_gate:
    enabled: true
    mode: driven
    afrr: { cm_threshold_dkk_mw_h: 75, block_mw: 2.82 }
    mfrr: { cm_threshold_dkk_mw_h: 300, block_mw: 4.46 }


# ------------------------------------------------------------------------------
# INVESTERING (ikke aktiv i backtest)
# ------------------------------------------------------------------------------
investment:
  enabled: false
