# ==============================================================================
# ANDEBY VARMEVÆRK — fiktivt referenceværk, helt kalenderår 2025
# ==============================================================================
# Andeby er et FIKTIVT referenceværk til regulerings-analyser (afgifter,
# tariffer m.m.). Det er afledt af cases/billund_2025.yaml (samme maskine:
# heat-syntese, activation_value-balancering, ancillary-config), men med et
# andet anlæg: en halmkedel (12 MW) som grundlast, en solvarmepark, og en
# flåde skaleret til et mindre værk (~100 GWh mod Billunds ~127,5 GWh,
# faktor 0,784).
#
# NYT i denne case: enhedstypen solar_thermal (fuel: "solar"). Solvarmens
# leverbare effekt bindes af en tidsvarierende profil-CSV
# (data/synthetic_solar_andeby.csv), ikke kun af nameplate. Profilen er
# syntetisk i trin 1 (se scripts/generate_solar_andeby.py) og erstattes
# senere med DMI-solstråling/måledata.
#
# KØRES MED (regulerings-brug = uden balancering, så varmeprisen er ren):
#   python run_case.py cases/andeby.yaml --data-source github
#
# Forventning: MILP (halmkedlen er en UC-enhed med min-uptime/p_min),
# halmkedel som grundlast (~55 % af varmeproduktionen), solvarme-andel
# ≈ 12 %, sommer-curtailment når tanken er fuld.
#
# INLINE-MARKØRER: [BEKRÆFT] = arvet fra billund_2025 og ikke kalibreret til
# Andeby (fiktivt værk, men hold tallene plausible).
# ==============================================================================

meta:
  case_name: "andeby"
  description: >
    Fiktivt referenceværk til regulerings-analyser. Halmkedel (12 MW) som
    grundlast; solvarme (profil-drevet loft via solar_thermal-enhedstypen);
    flåde skaleret til ~100 GWh. Afledt af billund_2025 (faktor 0,784 på
    heat_load-parametrene).
  titel: "Andeby — fiktivt referenceværk"
  gruppe: "andeby"
  timezone_internal: "UTC"
  timezone_reporting: "Europe/Copenhagen"
  discount_rate_real: 0.035
  tax_year: 2025

# ------------------------------------------------------------------------------
# TIDSHORISONT — hele kalenderåret 2025
# ------------------------------------------------------------------------------
time:
  start: "2025-01-01T00:00:00Z"
  end:   "2025-12-31T23:00:00Z"
  resolution: "1h"

# ------------------------------------------------------------------------------
# VARMELAST-SYNTESE — skaleret fra Billund med faktor 0,784 (~127,5 → ~100 GWh)
# ------------------------------------------------------------------------------
# baseline_profile_mw, gaf_mw_per_k og nettab_slope_mw_per_k er Billunds v2-
# kalibrering × 0,784. Resten af strukturen (t_ref, EMA, t_net) er uændret.
heat_load_params:
  gaf_mw_per_k: 0.7653          # 0,9761 × 0,784
  t_ref: 15.0
  thermal_inertia_hours: 24
  nettab_slope_mw_per_k: 0.4768 # 0,6081 × 0,784
  t_net: 12.0
  baseline_profile_mw:
    [4.437, 4.500, 4.602, 4.767, 4.822, 5.112,
     5.590, 5.606, 5.355, 4.955, 4.775, 4.696,
     4.563, 4.469, 4.414, 4.359, 4.430, 4.602,
     4.728, 4.767, 4.735, 4.728, 4.610, 4.390]
  weekly_dip: 0.02
  _source: "Billund dual-slope v2 × 0,784 (Andeby ~100 GWh) — aktiv ved syntese"

# ------------------------------------------------------------------------------
# PRISER OG AFGIFTER  [BEKRÆFT — arvet fra billund_2025, ikke Andeby-kalibreret]
# ------------------------------------------------------------------------------
prices:
  natural_gas:
    value: 606.0
    unit: "DKK/MWh_fuel"
  straw:
    value: 232.0
    unit: "DKK/MWh_fuel"
  flis:
    value: 232.0
    unit: "DKK/MWh_fuel"
  waste_heat:
    value: 50.0
    unit: "DKK/MWh_fuel"
  co2_eua:
    value: 600.0           # [BEKRÆFT] ~80 EUR/t × 7,45
    unit: "DKK/MWh_gas"

# ------------------------------------------------------------------------------
# ELMARKED OG TARIFFER  [BEKRÆFT — arvet fra billund_2025]
# ------------------------------------------------------------------------------
electricity:
  spot_area: "DK1"
  tariff_consumption_flat: 125.0   # bevaret som fallback; profilen nedenfor vinder

  # ---------------------------------------------------------------------
  # TIDSVARIERENDE FORBRUGSTARIF
  # ---------------------------------------------------------------------
  # Slå dine tre bånd op på dit eget netselskabs prisblad og skriv dem under
  # `bands`. Resten kan stå. Har dit netselskab to eller fem bånd, er navnene
  # frie — de defineres ét sted og refereres i skemaet.
  #
  # Elafgiften står her som dokumentation, men lægges til af modellen via
  # `electricity_tax` ovenfor og indgår IKKE i den opløste serie. De to tal
  # skal være ens, ellers afvises casen. En lavlasttime bliver altså 122,4
  # herfra og 126,4 med afgift.
  #
  # Helligdage ligger i koden (dansk kalender med påskeberegning, store
  # bededag afskaffet fra 2024). `extra_holidays` kan supplere.
  #
  # Timeintervaller er HALVÅBNE: "06-21" dækker time 6 til og med 20.
  # Opslaget sker på lokal tid, ikke UTC.
  tariff_consumption:
    unit: kr_per_mwh
    source: "Fiktivt netselskab, A-høj-lignende. Erstat med dit eget prisblad."
    fixed_components:
      energinet: 115.0        # transmissions-, system- og balancetarif
      dv: 0.0                 # drift og vedligehold — nul, men eksplicit
      elafgift_net: 4.0       # efter elvarmegodtgørelse; skal matche electricity_tax
    net_tariff:
      bands:
        lav: 7.4
        hoej: 14.8
        spids: 29.5
      seasons:
        vinter:
          months: [10, 11, 12, 1, 2, 3]
          weekday: {"00-06": lav, "06-21": spids, "21-24": hoej}
          weekend: {"00-06": lav, "06-21": hoej,  "21-24": hoej}
        sommer:
          months: [4, 5, 6, 7, 8, 9]
          weekday: {"00-06": lav, "06-24": hoej}
          weekend: {"00-06": lav, "06-24": lav}
  tariff_production_flat: 4.1
  electricity_tax: 4.0

# ------------------------------------------------------------------------------
# PRODUKTIONSENHEDER — Andebys flåde (ingen biomasse; solvarme tilføjet)
# ------------------------------------------------------------------------------
units:

  vp_luft_vand:
    enabled: true
    type: "heat_pump"
    p_max_heat: 3.4
    p_min_heat: 0.0
    alpha: -0.333
    fuel: "electricity"
    var_om: 13.4
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    cop_curve:
      type: linear
      a: 2.2
      b: 0.08
      cop_min: 1.8
      cop_max: 4.0
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
    commissioned: 2025

  # ---- Elkedel B (4 MW) ----
  elkedel_ny:
    enabled: true
    type: "electric_boiler"
    p_max_heat: 4.0
    p_min_heat: 0.0
    alpha: -1.0
    fuel: "electricity"
    var_om: 13.4
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    ancillary:
      # BUDVINDUE: måneder og lokale timer hvor enheden overhovedet afgiver bud
      # i kapacitetsmarkedet. Udeladt nøgle = ingen begrænsning. Det er en
      # driftsbeslutning, ikke en prisrespons — mange værker byder ikke deres
      # elkedel om sommeren, fordi et vundet bud tvinger produktion frem, som
      # tankene ikke kan optage. Varmedispatch og spot er urørt.
      bid_window: {months: [10, 11, 12, 1, 2, 3]}
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
    commissioned: 2025

  # ---- Elkedel A (12 MW) — udskiftet med halmkedel som grundlast ----
  elkedel_gl:
    enabled: false
    type: "electric_boiler"
    p_max_heat: 12.0
    p_min_heat: 0.0
    alpha: -1.0
    fuel: "electricity"
    var_om: 6.71
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
    commissioned: 2021

  # ---- Biomasse: halmkedel (12 MW) er grundlast; fliskedel fjernet ----
  fliskedel:
    enabled: false
    type: "biomass_boiler"
    p_max_heat: 7.0
    p_min_heat: 2.0
    alpha: 0.0
    fuel: "flis"
    eta_fuel_to_heat: 0.94
    var_om: 30.0
    start_cost: 5000.0
    min_uptime: 72
    min_downtime: 6
    uc_enabled: true
    initial_status: 1
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}
    commissioned: 2009

  halmkedel:
    enabled: true
    type: "biomass_boiler"
    p_max_heat: 12.0
    p_min_heat: 4.0
    alpha: 0.0
    fuel: "straw"
    eta_fuel_to_heat: 0.96
    var_om: 30.0
    start_cost: 8000.0
    min_uptime: 4
    min_downtime: 6
    uc_enabled: true
    initial_status: 1
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}
    commissioned: 2015

  gasmotor:
    enabled: true
    type: "gas_engine_chp"
    p_max_heat: 10.5
    p_min_heat: 0.9
    alpha: 0.838              # [BEKRÆFT] el 8,8 MW / varme 10,5 MW
    fuel: "natural_gas"
    eta_fuel_to_heat: 0.49
    var_om: 608.0             # [BEKRÆFT] arvet fra billund_2025
    start_cost: 2000.0
    min_uptime: 2
    min_downtime: 2
    uc_enabled: false
    initial_status: 0
    co2_emissions_per_mwh_fuel: 0.2   # fysisk udledning naturgas
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
      afrr_max_bid_mw: 1.0
      mfrr_max_bid_mw: 2.0
    commissioned: 2000

  gaskedel_agg:
    enabled: true
    type: "gas_boiler"
    p_max_heat: 20.0
    p_min_heat: 0.0
    alpha: 0.0
    fuel: "natural_gas"
    eta_fuel_to_heat: 0.95
    var_om: 89.0             # [BEKRÆFT] arvet fra billund_2025
    start_cost: 500.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    co2_emissions_per_mwh_fuel: 0.2   # fysisk udledning naturgas
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}

  # ---- NY: solvarmepark (Sol 1 + Sol 2 = 30.000 m²) ----
  solvarme:
    enabled: true
    type: "solar_thermal"
    p_max_heat: 22.0                 # nameplate; profil binder reelt ~8,3 MW peak
    p_min_heat: 0.0
    alpha: 0.0
    fuel: "solar"
    var_om: 0.0
    start_cost: 0.0
    uc_enabled: false
    production_profile_path: "data/synthetic_solar_andeby.csv"
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}
    notes: "Syntetisk profil i trin 1; udskiftes med DMI-solstråling/måledata senere."

# ------------------------------------------------------------------------------
# VARMELAGER — mindre tank end Billund (10.000 m³)
# ------------------------------------------------------------------------------
storage:
  # TO LAG. Mange værker har flere akkumulatorer på forskellige temperaturer:
  # varmepumpen leverer ved lavere fremløb end kedlerne, og ΔT — og dermed
  # kapaciteten — er derfor ikke ens for alle tankene. Skriv ét lager pr.
  # temperaturniveau frem for ét samlet med et gennemsnitligt ΔT.
  #
  # BEGRÆNSNING: modellen har endnu ingen kobling fra enhed til lager. De to
  # lag er to energilagre med hvert sit ΔT, ikke en rutning af, hvem der må
  # lade hvad. Det betyder noget om sommeren, hvor varmepumpen i praksis kun
  # kan lade det lave lag.
  tank_lav:
    enabled: true
    volume_m3: 7000
    delta_t_k: 30.0           # varmepumpe ved 70 °C, retur 40 °C
    e_max_mwh: null           # beregnes af volumen og ΔT
    e_initial_mwh: 122
    p_max_charge_mw: 25.0
    p_max_discharge_mw: 25.0
    self_discharge_per_hour: 0.0005
    cycle_binding: true
    notes: "Lavtemperaturlag (fiktivt)."

  tank_hoej:
    enabled: true
    volume_m3: 3000
    delta_t_k: 55.0           # kedler ved 95 °C, retur 40 °C
    e_max_mwh: null
    e_initial_mwh: 96
    p_max_charge_mw: 25.0
    p_max_discharge_mw: 25.0
    self_discharge_per_hour: 0.0005
    cycle_binding: true
    notes: "Højtemperaturlag (fiktivt)."

# ------------------------------------------------------------------------------
# BALANCEMARKED — arvet fra billund_2025 (inert uden --with-balancing)
# ------------------------------------------------------------------------------
# Regulerings-brug kører UDEN --with-balancing, så denne blok er inaktiv og
# varmeprisen er ren. Beholdt for fidelity hvis Andeby senere skal byde.
balancing:
  method: activation_value
  bid_strategy:
    up_markup_dkk_mwh: 500
    up_markup_max_dkk_mwh: 2000
  ancillary_caps:
    # per_unit_mw er prækvalificeringen: hvor meget eloptag enheden må binde
    # i alt på tværs af begge markeder.
    per_unit_mw:
      vp_luft_vand: 6.0       # [BEKRÆFT] fiktiv prækvalificering
    # per_unit_market_mw er værkets EGEN fordeling mellem markederne. Begge
    # lofter håndhæves, og den strammere binder. Summen må gerne være mindre
    # end prækvalificeringen — det er den normalt.
    per_unit_market_mw:
      vp_luft_vand: {afrr: 2.0, mfrr: 3.0}
    total_mw: 14.0            # [BEKRÆFT] samlet prækvalificeret kapacitet

  # ---------------------------------------------------------------------
  # BUDTÆRSKEL REGNET AF BRÆNDSELSSTAKKEN
  # ---------------------------------------------------------------------
  # τ(t) = spot + tarif + COP·var_om − COP·alternativ
  #
  # Alternativomkostningen ved at binde 1 MW eloptag i én time: hvad elvarmen
  # koster, minus hvad den varme ellers ville have kostet. Er kapacitets-
  # prisen større, betaler det sig at byde.
  #
  # Det er den parameter, der ellers kræver et års afregningsdata at
  # kalibrere. Her regner modellen den af enhederne og brændselspriserne i
  # denne fil. Et værk med dyr gas på marginalen om vinteren får automatisk en
  # højere tærskel end et værk med rigelig biomasse.
  #
  # reference_unit er den elforbrugende enhed, tærsklen regnes for.
  # floor_dkk_mw_h er et gulv på budprisen.
  reservation_gate:
    enabled: false            # slå til med --with-balancing-scenarier
    mode: bound
    afrr:
      opportunity_cost: {reference_unit: vp_luft_vand, floor_dkk_mw_h: 50}
      block_mw: 3.0
    mfrr:
      opportunity_cost: {reference_unit: vp_luft_vand, floor_dkk_mw_h: 50}
      block_mw: 4.0

# ------------------------------------------------------------------------------
# INVESTERING (ikke aktiv)
# ------------------------------------------------------------------------------
investment:
  enabled: false
