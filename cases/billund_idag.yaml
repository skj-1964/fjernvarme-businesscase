# ==============================================================================
# BILLUND_IDAG - Billunds anlaeg i dag, rullende aar 1. juli 2025 - 30. juni 2026
# ==============================================================================
# SCENARIE, IKKE VALIDERET. Bruges i rapport v4, afsnit 4.5.
#
# Forskelle fra billund_sporA_rullende.yaml:
#   * elkedel_ny (30 MW) er med (enabled: true).
#   * Varmepumpen byder i balancemarkedet hele aaret (ingen available_from).
#   * Flis- og halmkedlen starter slukket (initial_status: 0). Med dem taendt
#     1. juli er casen uloeselig uden tank.
#   * solver-blok med 0,1 % gab, fordi casen bruges til differenser.
#
# Billund 15/10-2026: alle tre el-enheder er praekvalificeret (5,52 + 12 + 30 =
# 47,52 MW), men nettilslutningen tillader hoejst 33 MW el i alt (grid-blokken).
# Kapacitetsprisgatens blokke er skaleret i samme forhold som loftet
# (2,82/4,46 -> 7,65/12,10 MW), ellers binder blokkene foer loftet.
# Den gamle konfiguration (kun VP og den aeldre elkedel, 17,52 MW):
#   --set balancing.ancillary_caps.total_mw=17.52 \
#   --set balancing.reservation_gate.afrr.block_mw=2.82 \
#   --set balancing.reservation_gate.mfrr.block_mw=4.46
# Uden netloft: --set grid.max_consumption_mw=1000
#
# Faktisk marked:
#   python run_case.py cases/billund_idag.yaml --data-source github --with-balancing \
#       --heat-csv data/billund_abvaerk_hourly_splejset_jun2026.csv
# Fiktivt 2026-marked (se doc/BALANCEMARKED.md):
#   python scripts/fiktivt_balancemarked.py
#   python run_case.py cases/billund_idag.yaml --data-source github --with-balancing \
#       --df-data-cache data/df-data-2026niveau \
#       --heat-csv data/billund_abvaerk_hourly_splejset_jun2026.csv
# ==============================================================================
# ==============================================================================
# BILLUND_SPORA_RULLENDE - rullende aar 1. juli 2025 - 30. juni 2026
# ==============================================================================
# Afledt af billund_sporA.yaml ved kun at aendre vindue og DMI-station.
#
# ADVARSEL OM VALIDERING: vinduet indeholder januar-februar 2026, hvor
# varmepumperne var i indkoering. Til en FREMADRETTET businesscase er det
# fint. Til validering mod facit er de to maaneder ikke troevaerdige -- det
# rene vindue starter marts 2026, og det er derfor billund_sporA.yaml findes.
# ==============================================================================

# ==============================================================================
# BILLUND VARMEVÆRK — Backtest mod realiseret drift, jan–april 2026
# ==============================================================================
# Opbygningen stammer fra backtest-casen jan–apr 2026. Anlæg, lofter og
# netloft er sat til Billund i dag; se hovedet øverst i filen. Afsnittene
# nedenfor om validering er historik fra backtesten.
#
# VALIDERING: sammenlign mod realiseret balance-facit jan–apr 2026 pr. produkt
# (aFRR akt/kap, mFRR akt/kap). Forvent at activation_value rammer aFRR-
# aktivering markant højere end legacy (kovarians-spikene).
#
# ANOMALI — VALIDERINGSVINDUE = MARTS 2026 FREM (John):
#   Jan–feb 2026 var VP-indkøring, og indkøringen påvirkede balance-
#   indmeldingen PLANT-BREDT (ikke kun VP'en). Jan–feb er derfor en
#   indkøringsanomali, IKKE repræsentativ drift, og UDELADES af validering.
#   Bekræftet ved diagnostik (STATUS v7): plant-bred onset → modelleret jan+feb
#   = 0. Valideringsvinduet er det RENE vindue marts–april 2026 (facit stopper
#   ved april). VP'ens available_from nedenfor er det eneste reelle anlægs-
#   faktum; de øvrige enheders jan/feb-nul modelleres IKKE (udelukkes, ikke fit).
#
# BEKRÆFT FØR KØRSEL:
#   - Prisniveauer (gas/halm) er kopieret fra H2 2025 — opdatér med Q1 2026.
#   - Tankvolumen jan–apr 2026 (12.000 vs 22.000 m³ VAK26) — sæt fra drift.
#   - elafgift (4 vs 45,6 DKK/MWh) — som i fase2.
# ==============================================================================

meta:
  case_name: "billund_idag"
  description: >
    Scenarie, ikke valideret: Billunds anlaeg i dag (ny 30 MW elkedel med,
    varmepumpen byder hele aaret) paa det rullende aar juli 2025-juni 2026.
    Spor A (kapacitetsprisgate, oevre graense). Op-bud = spot + 500 DKK/MWh.
  timezone_internal: "UTC"
  timezone_reporting: "Europe/Copenhagen"
  discount_rate_real: 0.035
  tax_year: 2026

# ------------------------------------------------------------------------------
# EKSTERNE DATAKILDER
# ------------------------------------------------------------------------------
# karup, IKKE fyn. fyn mangler 1. januar 2026 (2 timer) og 28. februar 2026
# (29 timer) og fejler paa coverage i dette vindue. karup har nul huller.
#
# NB: marts-juni-caserne koerer paa fyn, fordi ankeret er produceret der.
# Resultater fra de to vinduer kan derfor ikke sammenlignes direkte -- valget
# af DMI-station flytter objektivet med knap fire procent.
data:
  dmi_area: "karup"
  price_zone: "DK1"

# ------------------------------------------------------------------------------
# TIDSHORISONT
# ------------------------------------------------------------------------------
time:
  # Aftalt med John: kør marts–juni 2026 (rent vindue, post-indkøring, VP på balance).
  # Jan–feb udeladt (indkøringsanomali). Slut ved 23/6 — varme-CSV stopper 24/6 06:00.
  start: "2025-07-01T00:00:00Z"
  end:   "2026-06-30T23:00:00Z"
  resolution: "1h"

# ------------------------------------------------------------------------------
# VARMELAST-SYNTESE (parses men ignoreres når --heat-csv er aktivt)
# ------------------------------------------------------------------------------
heat_load_params:
  gaf_mw_per_k: 0.9761
  t_ref: 15.0
  thermal_inertia_hours: 24
  nettab_slope_mw_per_k: 0.6081
  t_net: 12.0
  baseline_profile_mw:
    [5.66, 5.74, 5.87, 6.08, 6.15, 6.52,
     7.13, 7.15, 6.83, 6.32, 6.09, 5.99,
     5.82, 5.70, 5.63, 5.56, 5.65, 5.87,
     6.03, 6.08, 6.04, 6.03, 5.88, 5.60]
  weekly_dip: 0.02
  _source: "Kalibreret mod Billund ab værk — ignoreres ved --heat-csv"

# ------------------------------------------------------------------------------
# PRISER OG AFGIFTER  (BEKRÆFT: kopieret fra H2 2025 — opdatér til Q1 2026)
# ------------------------------------------------------------------------------
prices:
  natural_gas:
    value: 550.0           # 3 kr/Nm3 commodity (ekskl moms) + kedel-afgifter 3,5349 kr/Nm3 (faktura, ekskl moms) ÷ 11,881 kWh/Nm3
    unit: "DKK/MWh_fuel"
  straw:
    value: 204.6           # 1.030 kr/ton inkl moms ÷ 1,25 ÷ 14,5 GJ/ton × 3,6 (ekskl moms)
    unit: "DKK/MWh_fuel"
  flis:
    value: 195.8           # 68,0 kr/GJ inkl moms ÷ 1,25 × 3,6 (ekskl moms) — egen pris, ikke længere lig halm
    unit: "DKK/MWh_fuel"
  waste_heat:
    value: 50.0
    unit: "DKK/MWh_fuel"
  co2_eua:
    value: 0.0
    unit: "DKK/MWh_gas"

# ------------------------------------------------------------------------------
# ELMARKED OG TARIFFER
# ------------------------------------------------------------------------------
electricity:
  spot_area: "DK1"
  tariff_consumption_flat: 128.2   # faktisk marginal A-høj i vinduet (kun A-høj fra maj)
  tariff_production_flat: 4.1
  electricity_tax: 4.0

# ------------------------------------------------------------------------------
# PRODUKTIONSENHEDER
# ------------------------------------------------------------------------------
units:

  vp_luft_vand:
    enabled: true
    type: "heat_pump"
    # Loft på varmesiden = tabellens største varme; timeloftet følger
    # udetemperaturen via cop_curve nedenfor.
    p_max_heat: 21.0
    p_min_heat: 0.0
    alpha: -0.3438          # -1/COP ved 0 °C; fallback, bruges ikke
    fuel: "electricity"
    var_om: 13.4
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    # Ydelse ved fuld last (John, september 2026). Varme og el interpoleres
    # hver for sig; COP = varme/el; uden for punkterne holdes yderværdien.
    # Afløser den lineære kurve (fast varmeloft, COP 1,8–4,0), som gav
    # størst eloptag i frost — det omvendte af en luft/vand-varmepumpe.
    cop_curve:
      type: table
      points:
        - { t_ambient:  -10.0, heat_mw: 12.0, el_mw: 5.0 }   # COP 2.40
        - { t_ambient:    0.0, heat_mw: 16.0, el_mw: 5.5 }   # COP 2.91
        - { t_ambient:   16.0, heat_mw: 21.0, el_mw: 6.2 }   # COP 3.39
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
      # ANLÆGSFAKTUM (John): VP'en gik først på balancemarkedet 1. marts 2026.
      # Februars nul-deltagelse er en onset/idriftsættelse, ikke en prisrespons.
      # Gaten nulstiller VP'ens reservation før denne dato; varmedispatch urørt.
    commissioned: 2025

  # ---- Elkedel ny (30 MW) — i drift og prækvalificeret (Billund 15/10-2026) ----
  elkedel_ny:
    enabled: true
    type: "electric_boiler"
    p_max_heat: 30.0
    p_min_heat: 0.0
    alpha: -1.0
    fuel: "electricity"
    var_om: 13.4
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
    commissioned: 2026
    notes: "I drift; prækvalificeret (Billund 15/10-2026). Samlet eloptag er begrænset til 33 MW af nettilslutningen (grid-blokken)."

  elkedel_gl:
    enabled: true
    type: "electric_boiler"
    p_max_heat: 12.0          # John 26/8: godkendt 15 MW, teknisk droslet til 12 MW
    p_min_heat: 0.0
    alpha: -1.0
    fuel: "electricity"
    var_om: 6.71
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
    commissioned: 2021

  fliskedel:
    enabled: true
    type: "biomass_boiler"
    p_max_heat: 7.0
    p_min_heat: 2.5           # Billund-bekræftet min-last (~36% af 7 MW)
    alpha: 0.0
    fuel: "flis"
    eta_fuel_to_heat: 0.94    # John
    var_om: 30.0              # ANTAGET = halm — bekræft
    start_cost: 5000.0        # ANTAGET — bekræft
    min_uptime: 168           # Billund: skal mindst køre 1 uge (168 timer) ad gangen
    min_downtime: 6
    uc_enabled: true
    initial_status: 0
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}
    commissioned: 2009

  halmkedel:
    enabled: true
    type: "biomass_boiler"
    p_max_heat: 12.0
    p_min_heat: 4.0
    alpha: 0.0
    fuel: "straw"
    eta_fuel_to_heat: 0.96
    var_om: 30.0
    start_cost: 8000.0
    min_uptime: 4
    min_downtime: 6
    uc_enabled: true
    initial_status: 0
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}
    commissioned: 2015

  gasmotor:
    enabled: true
    type: "gas_engine_chp"
    p_max_heat: 2.8
    p_min_heat: 0.9
    alpha: 0.72
    fuel: "natural_gas"
    eta_fuel_to_heat: 0.49
    var_om: 608.0
    start_cost: 2000.0
    min_uptime: 2
    min_downtime: 2
    uc_enabled: false
    initial_status: 0
    co2_emissions_per_mwh_fuel: 0.0
    ancillary:
      afrr_qualified: true
      mfrr_qualified: true
      fcr_qualified: false
      afrr_max_bid_mw: 1.0
      mfrr_max_bid_mw: 2.0
    commissioned: 2000

  gaskedel_agg:
    enabled: true
    type: "gas_boiler"
    p_max_heat: 16.3
    p_min_heat: 0.0
    alpha: 0.0
    fuel: "natural_gas"
    eta_fuel_to_heat: 0.95
    var_om: 89.0
    start_cost: 500.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    co2_emissions_per_mwh_fuel: 0.0
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}

  overskudsvarme:
    enabled: false
    type: "waste_heat"
    p_max_heat: 4.0
    p_min_heat: 4.0
    alpha: 0.0
    fuel: "waste_heat"
    eta_fuel_to_heat: 1.0
    var_om: 5.0
    start_cost: 0.0
    min_uptime: 1
    min_downtime: 1
    uc_enabled: false
    ancillary: {afrr_qualified: false, mfrr_qualified: false, fcr_qualified: false}
    commissioned: 2026

# ------------------------------------------------------------------------------
# VARMELAGER  (BEKRÆFT volumen jan–apr 2026: 12.000 vs 22.000 m³ VAK26)
# ------------------------------------------------------------------------------
storage:
  tank_eksisterende:
    enabled: true
    volume_m3: 14000          # John: 10.000 + 2.000 + 2.000 m3 VAK
    delta_t_k: 40.0
    e_max_mwh: null
    e_initial_mwh: 279
    p_max_charge_mw: 60.0
    p_max_discharge_mw: 60.0
    self_discharge_per_hour: 0.0
    cycle_binding: true
    notes: "Volumen bekræftet 14.000 m3. [BEKRÆFT delta_t: VP vinter 80C=40K, elkedler/biomasse 95C=55K, VP sommer 70C=30K — sæt sæson-/kilde-afhængigt]"

# ------------------------------------------------------------------------------
# BALANCEMARKED — ny metode (activation_value) + generiske lofter
# ------------------------------------------------------------------------------
# method:
#   activation_value = kovarians-korrekt av(t), beregnet i datalaget fra
#                      15-min aktiveringspriser mod budkurven spot + markup.
#   legacy           = gammel E[α]×E[p]. Skift via --balancing-method legacy.
#
# bid_strategy (jf. interview John/Jens, Billund):
#   op-bud = spot + up_markup_dkk_mwh. up_markup_max er øvre båndgrænse
#   (tank-styret positionering, Tier 2 — bruges ikke i Tier-1-av endnu).
#   down_markdown udeladt → up-only (som nuværende modelscope).
#
# ancillary_caps:
#   per_unit_mw: VP ≤ 5,52 MW (aFRR+mFRR samlet), håndhæves ALTID.
#   total_mw:    Σ alle bud ≤ 47,52 MW = Billunds prækvalificering med alle tre
#                el-enheder (VP 5,52 + elkedel_gl 12 + elkedel_ny 30), 15/10-2026.
#                Det samlede eloptag begrænses desuden af grid-blokken (33 MW).
balancing:
  method: activation_value
  bid_strategy:
    up_markup_dkk_mwh: 500
    up_markup_max_dkk_mwh: 2000
  ancillary_caps:
    per_unit_mw:
      vp_luft_vand: 5.52        # John 26/8: prækvalificeret eloptag
    total_mw: 47.52          # Billund 15/10: VP 5,52 + elkedel_gl 12 + elkedel_ny 30
  # Spor B — CM-gate rekalibreret på det RENE vindue marts–juni 2026.
  # gate-frekvens × block_mw = facit MW-snit (aFRR 0,743 / mFRR 0,509).
  #   aFRR: tau=75  → frekvens 26,3 % → B=2,82
  #   mFRR: tau=300 → frekvens 11,4 % → B=4,46
  reservation_gate:
    enabled: true
    mode: bound
    afrr: { cm_threshold_dkk_mw_h: 75, block_mw: 7.65 }   # 2,82 x 47,52/17,52
    mfrr: { cm_threshold_dkk_mw_h: 300, block_mw: 12.10 }  # 4,46 x 47,52/17,52

# ------------------------------------------------------------------------------
# NETTILSLUTNING — Billund 15/10-2026: hoejst 33 MW el i alt (VP + elkedler).
# Gaelder driften foer aktivering og, med robust reservation, planen uden
# aktivering. Gasmotorens elproduktion modregnes ikke.
# ------------------------------------------------------------------------------
grid:
  max_consumption_mw: 33.0

# ------------------------------------------------------------------------------
# INVESTERING (ikke aktiv i backtest)
# ------------------------------------------------------------------------------
investment:
  enabled: false

solver:
  mip_rel_gap: 0.001
  mip_abs_gap: 1000.0
  time_limit: 3600.0
